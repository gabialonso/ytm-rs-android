[package]
name = "ytm-rs"
version = "0.2.34"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/grapedjuice/ytm-rs"
description = "Native YouTube Music client"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
bytes = "1.12.1"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "system_fonts", "links", "clipboard", "persistence"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
env_logger = { version = "0.11.11", default-features = false, features = ["humantime"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
localzone = "0.3.1"
log = "0.4.34"
memmap2 = "0.9.11"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "socks"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4"] }
rquickjs = "0.14.0"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
skrifa = "0.44.0"
sha1 = "0.10.7"
sha2 = "0.10.9"
hmac = "0.12.1"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5.8"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
mp4ameta = "0.13.0"
md-5 = "0.10"
unicode-normalization = "0.1.26"
symphonia = { version = "0.5.5", default-features = false, features = ["mkv"] }
rusty-opus = "1.0.2"
unicode-bidi = "0.3"

# Everything a desktop build has and the Android port leaves out (see HANDOFF.md):
# webview sign-in, tray, OS media controls, file dialogs, Discord, video.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "wayland", "x11", "wgpu_no_default_features"] }
# The opt-in renderer: Vulkan, Metal on macOS (renderer.rs). Android draws with OpenGL only.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["native-tls"] }
discord-rich-presence = "1.1.0"
souvlaki = "0.8.3"
tao = "0.37.1"
wry = "0.57.0"
rfd = "0.17.2"
tray-icon = "0.26.1"
# Music videos: YouTube's H.264, decoded on the CPU. Built from source; faster with nasm installed.
openh264 = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["android-native-activity"] }
# rustls: no OpenSSL to cross-build for the NDK.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
jni = "0.21.1"
# The same winit eframe uses, for its `AndroidApp`.
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
ndk-context = "0.1.1"
android_logger = "0.15"
# The allocator (lib.rs): Android's own is slow at egui's many small allocations.
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }
# rquickjs ships no prebuilt bindings for Android: generate them (needs LIBCLANG_PATH,
# see android/README.md).
rquickjs = { version = "0.14.0", features = ["bindgen"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager, for the Google and Spotify sign-ins.
keyring = { version = "3.6.3", features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The Secret Service (GNOME Keyring, KWallet) for the sign-ins.
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
# The tray icon needs GTK running on a thread of its own.
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# The login Keychain for the sign-ins.
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Unwind, not abort: a panic while handling one request (in a library or a parser)
# must fail that request, not close the app.
panic = "unwind"

# The Android release (android/build.sh): a phone pays for every megabyte twice (the
# download, and the install, since the library isn't compressed). Dependencies built for
# size, except what runs every frame or every sample (drawing, text, audio decoding,
# the download's TLS, cover decoding), and the app itself, built for speed.
[profile.android]
inherits = "release"

[profile.android.package."*"]
opt-level = "s"

[profile.android.package.egui]
opt-level = 3

[profile.android.package.epaint]
opt-level = 3

[profile.android.package.emath]
opt-level = 3

[profile.android.package.ecolor]
opt-level = 3

[profile.android.package.eframe]
opt-level = 3

[profile.android.package.egui_glow]
opt-level = 3

[profile.android.package.egui-winit]
opt-level = 3

[profile.android.package.glow]
opt-level = 3

[profile.android.package.harfrust]
opt-level = 3

[profile.android.package.skrifa]
opt-level = 3

[profile.android.package.read-fonts]
opt-level = 3

[profile.android.package.vello_cpu]
opt-level = 3

[profile.android.package.rodio]
opt-level = 3

[profile.android.package.cpal]
opt-level = 3

[profile.android.package.symphonia-core]
opt-level = 3

[profile.android.package.symphonia-codec-aac]
opt-level = 3

[profile.android.package.symphonia-format-isomp4]
opt-level = 3

[profile.android.package.rusty-opus]
opt-level = 3

[profile.android.package.ring]
opt-level = 3

[profile.android.package.rustls]
opt-level = 3

[profile.android.package.zune-jpeg]
opt-level = 3

[profile.android.package.image-webp]
opt-level = 3

[profile.android.package.png]
opt-level = 3

[profile.android.package.fdeflate]
opt-level = 3

[profile.android.package.libmimalloc-sys]
opt-level = 3

[profile.android.package.mimalloc]
opt-level = 3

# QuickJS parses and preprocesses each new YouTube player (~2.5 MB of script): built
# for size it took 7 s on the phone.
[profile.android.package.rquickjs-sys]
opt-level = 3

[profile.android.package.rquickjs-core]
opt-level = 3

# Keep debug builds usable: optimize dependencies (decoders, egui) even in dev.
[profile.dev.package."*"]
opt-level = 2

[lib]
# Android loads the app as libytm_rs.so; on desktop the library is empty (src/lib.rs).
crate-type = ["cdylib"]

[dev-dependencies]
egui_system_font_provider = "0.37.0"

[build-dependencies]
winresource = "0.1.31"
